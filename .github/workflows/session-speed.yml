name: Session speed

# Times restart, the desktop bootstrap, and opening a long session at the pull request's base and
# at its head on one runner, and flags what got slower. It never blocks anything: it is not a
# release gate, every step after setup may fail without failing the run, and regressions surface
# only as warnings and in the job summary.

on:
    pull_request:
        paths:
            - ".github/workflows/session-speed.yml"
            - "packages/happy-agent/**"
            - "packages/happy-agent-base/**"
            - "packages/happy-agent-client/**"
            - "packages/happy-agent-gym/**"
            - "packages/happy-agent-modules/**"
            - "patches/**"
            - "pnpm-lock.yaml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: session-speed-${{ github.ref }}
    cancel-in-progress: true

jobs:
    bench:
        name: Base vs head
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        continue-on-error: true
        env:
            NODE_OPTIONS: --max-old-space-size=6144
            BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}

        steps:
            - name: Check out the repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Prepare the base checkout
              # The benchmark comes from the head, so a base that predates it is measured the same way.
              run: |
                  git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
                  mkdir -p "$RUNNER_TEMP/base/packages/happy-agent-gym/perf"
                  cp packages/happy-agent-gym/perf/*.ts "$RUNNER_TEMP/base/packages/happy-agent-gym/perf/"

            - name: Build and benchmark the base
              continue-on-error: true
              working-directory: ${{ runner.temp }}/base
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --filter @slopus/happy-agent-base build
                  pnpm --filter @slopus/happy-agent-client build
                  pnpm --filter @slopus/happy-agent-modules build
                  pnpm --filter @slopus/happy-agent build
                  cd packages/happy-agent-gym
                  PERF_OUT="$RUNNER_TEMP/base.json" node --import tsx perf/ciBench.ts

            - name: Build and benchmark the head
              run: |
                  pnpm install --frozen-lockfile
                  pnpm --filter @slopus/happy-agent-base build
                  pnpm --filter @slopus/happy-agent-client build
                  pnpm --filter @slopus/happy-agent-modules build
                  pnpm --filter @slopus/happy-agent build
                  cd packages/happy-agent-gym
                  PERF_OUT="$RUNNER_TEMP/head.json" node --import tsx perf/ciBench.ts

            - name: Compare
              if: always()
              working-directory: packages/happy-agent-gym
              run: node --import tsx perf/ciCompare.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"
